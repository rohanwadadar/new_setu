    <!-- ══════════════════════════════════════════════════════════
         APPLE / iOS — iMessage · Safari · Home Screen
         • apple-mobile-web-app-capable  → tells iOS crawler this
           is a well-formed static page (not a broken JS shell).
         • apple-touch-icon (4 sizes)    → used by Share Sheet &
           home screen icon on iPhone + iPad.
         • format-detection telephone=no → prevents iOS from
           turning numbers in title/desc into tel: links, which
           corrupts the iMessage preview card layout.

    ══════════════════════════════════════════════════════════ -->
